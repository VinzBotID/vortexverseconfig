<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07050d">
<title>Vortex Config Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050d;
  --gold1:#f8e9b8;--gold2:#d9ac4f;--gold3:#8f6a1f;
  --gold:linear-gradient(135deg,#f8e9b8 0%,#d9ac4f 45%,#9a7424 100%);
  --vio:#8b5cf6;--vio2:#c4a1ff;
  --text:#f4f0fb;--mut:#a79fbe;--line:rgba(255,255,255,.09);
  --glass:rgba(255,255,255,.045);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding:26px 16px 130px;overflow-x:hidden}

body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
body::before{width:420px;height:420px;background:#5b2fd1;top:-140px;left:-120px;animation:float 14s ease-in-out infinite}
body::after{width:380px;height:380px;background:#b8861f;bottom:-140px;right:-120px;opacity:.28;animation:float 18s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(40px,30px) scale(1.12)}}

.wrap{max-width:760px;margin:0 auto}

header{text-align:center;margin:6px 0 26px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.28em;color:var(--gold2);border:1px solid rgba(217,172,79,.35);background:rgba(217,172,79,.07);border-radius:999px;padding:7px 14px}
.tag i{width:6px;height:6px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px var(--gold2)}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(38px,11vw,60px);line-height:1.02;margin:16px 0 8px;font-weight:800;letter-spacing:.02em}
h1 .g{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11.5px;letter-spacing:.42em;color:var(--mut);font-weight:600}
.rule{height:1px;width:140px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}

.panel{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:26px;padding:20px 18px;margin-bottom:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 20px 50px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06)}
.panel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,rgba(217,172,79,.45),transparent 35%,transparent 70%,rgba(139,92,246,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px}
.ph .no{font-family:"Playfair Display",serif;font-size:13px;color:var(--gold2);letter-spacing:.1em}
.ph h2{font-size:17px;font-weight:800;letter-spacing:.1em;margin-top:2px}
.ph .meta{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mut);text-align:right}
.ph .meta b{color:var(--gold1)}

.chars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.char{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;cursor:pointer;border:1.5px solid var(--line);background:#120d22;padding:0;color:var(--text);font-family:inherit;transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s,filter .3s;filter:saturate(.55) brightness(.7)}
.char:hover{transform:translateY(-3px)}
.char.on{filter:none;border-color:var(--gold2);box-shadow:0 0 0 1px rgba(217,172,79,.5),0 18px 50px -12px rgba(217,172,79,.45)}
.char .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:120px;font-weight:800;color:rgba(255,255,255,.1)}
.char:nth-child(1) .art{background:radial-gradient(circle at 50% 30%,#6d3fe0,#1a0f3d 70%)}
.char:nth-child(2) .art{background:radial-gradient(circle at 50% 30%,#d97a1f,#3a1405 70%)}
.char img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .6s}
.char.on img{transform:scale(1.05)}
.char .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,5,13,.95) 0%,rgba(7,5,13,.1) 55%,transparent)}
.char .cap{position:absolute;left:0;right:0;bottom:0;padding:14px;text-align:left}
.char .cap small{display:block;font-size:9.5px;letter-spacing:.3em;color:var(--gold2);font-weight:700;margin-bottom:3px}
.char .cap strong{font-family:"Playfair Display",serif;font-size:26px;font-weight:700;letter-spacing:.04em}
.char .ok{position:absolute;top:10px;right:10px;font-size:9.5px;font-weight:800;letter-spacing:.16em;padding:5px 9px;border-radius:999px;background:var(--gold);color:#2b1d05;opacity:0;transform:scale(.8);transition:.3s}
.char.on .ok{opacity:1;transform:none}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:5px}
.seg button{border:none;background:transparent;color:var(--mut);font-family:inherit;font-weight:800;font-size:12.5px;letter-spacing:.1em;padding:14px 8px;border-radius:12px;cursor:pointer;text-transform:uppercase;transition:.3s}
.seg button.on{background:var(--gold);color:#2b1d05;box-shadow:0 8px 22px -8px rgba(217,172,79,.7)}

.preview{border:1.5px dashed rgba(255,255,255,.14);border-radius:18px;padding:14px;min-height:92px;display:flex;flex-wrap:wrap;gap:9px;align-content:center;justify-content:center;background:rgba(0,0,0,.22)}
.empty{color:var(--mut);font-size:13px;text-align:center;letter-spacing:.04em}
.chip{display:flex;align-items:center;gap:9px;background:rgba(217,172,79,.09);border:1px solid rgba(217,172,79,.4);border-radius:999px;padding:6px 8px 6px 6px;font-size:12.5px;font-weight:600;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.85)}}
.chip .cth{width:28px;height:28px;border-radius:50%;background:#1b1330;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gold2);font-weight:800;flex:none}
.chip .cth img{width:100%;height:100%;object-fit:cover}
.chip em{font-style:normal;color:var(--gold2);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;display:block;line-height:1.1}
.chip span.nm{display:block;line-height:1.2}
.chip button{border:none;background:rgba(255,255,255,.08);color:var(--text);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;line-height:1}

.cats{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;position:relative;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-family:inherit;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px;border-radius:999px;cursor:pointer;transition:.3s}
.cat.on{background:var(--gold);color:#2b1d05;border-color:transparent;box-shadow:0 8px 22px -8px rgba(217,172,79,.7)}
.cat .dot{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;border-radius:50%;background:var(--vio);color:#fff;font-size:10px;line-height:18px;text-align:center;box-shadow:0 0 0 2px #0d0918}

.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
@media(min-width:560px){.items{grid-template-columns:repeat(3,1fr)}}
.item{position:relative;border:1.5px solid var(--line);background:rgba(255,255,255,.04);border-radius:18px;overflow:hidden;cursor:pointer;color:var(--text);font-family:inherit;text-align:left;padding:0;transition:transform .3s,border-color .3s,box-shadow .3s}
.item:hover{transform:translateY(-3px)}
.item.on{border-color:var(--gold2);box-shadow:0 0 0 1px rgba(217,172,79,.5),0 16px 36px -14px rgba(217,172,79,.5)}
.item .th{aspect-ratio:1/1;background:radial-gradient(circle at 50% 35%,#2a1d52,#0e0919 75%);display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:44px;font-weight:800;color:rgba(217,172,79,.55)}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .tt{padding:11px 12px 13px;font-size:12.5px;font-weight:700;line-height:1.3;word-break:break-word}
.item .chk{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#2b1d05;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5);transition:.3s}
.item.on .chk{opacity:1;transform:none}
.none{grid-column:1/-1;text-align:center;color:var(--mut);font-size:13px;padding:34px 10px;letter-spacing:.04em}

.err{background:rgba(120,30,60,.25);border:1px solid rgba(255,100,140,.4);color:#ffc2d1;border-radius:18px;padding:18px;font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(7,5,13,.97) 55%,rgba(7,5,13,0));}
.bar .in{max-width:760px;margin:0 auto}
#dl{position:relative;overflow:hidden;width:100%;padding:18px;border:none;border-radius:18px;font-family:inherit;font-size:14px;font-weight:800;letter-spacing:.16em;color:#2b1d05;background:var(--gold);cursor:pointer;box-shadow:0 14px 40px -10px rgba(217,172,79,.65);transition:transform .2s}
#dl:active{transform:scale(.98)}
#dl:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
@keyframes shine{to{left:120%}}
#dl:disabled{background:rgba(255,255,255,.08);color:var(--mut);box-shadow:none;cursor:not-allowed}

.reveal{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.reveal:nth-child(2){animation-delay:.08s}.reveal:nth-child(3){animation-delay:.16s}.reveal:nth-child(4){animation-delay:.24s}.reveal:nth-child(5){animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
footer{text-align:center;color:var(--mut);font-size:10.5px;letter-spacing:.3em;margin-top:24px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="panel"><div class="empty">Memuat...</div></div></div>
<div class="bar"><div class="in"><button id="dl" disabled>DOWNLOAD ZIP</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
let data = null, char = null, version = null, category = null;
const store = {};
let first = true;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
const key = () => char + '|' + version;
const picks = () => store[key()] || (store[key()] = {});
const nameOf = (list, id) => (list.find(x => x.id === id) || {}).name || '';

function thumbBox(cls, it) {
  const box = el('div', cls, it.name.charAt(0).toUpperCase());
  if (it.thumb) {
    const img = document.createElement('img');
    img.src = it.thumb; img.alt = ''; img.loading = 'lazy';
    img.onload = () => { box.textContent = ''; box.append(img); };
  }
  return box;
}

async function init() {
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (!r.ok) throw new Error('data.json tidak ditemukan (status ' + r.status + ')');
    data = await r.json();
  } catch (e) {
    document.getElementById('app').replaceChildren(el('div', 'err', 'Gagal memuat data: ' + e.message));
    return;
  }
  char = data.characters[0].id;
  version = data.versions[0].id;
  category = data.categories[0].id;
  render();
}

function panel(no, title, meta) {
  const p = el('section', 'panel' + (first ? ' reveal' : ''));
  const h = el('div', 'ph');
  const l = el('div');
  l.append(el('div', 'no', no), el('h2', '', title));
  const m = el('div', 'meta');
  if (meta) m.innerHTML = meta;
  h.append(l, m);
  p.append(h);
  return p;
}

function render() {
  const app = document.getElementById('app');
  const oldCats = app.querySelector('.cats');
  const catScroll = oldCats ? oldCats.scrollLeft : 0;
  app.replaceChildren();

  const head = el('header', first ? 'reveal' : '');
  const tag = el('div', 'tag'); tag.append(el('i'), document.createTextNode('ANDROID ONLY'));
  const h1 = el('h1'); h1.append(document.createTextNode('VORTEX '), el('span', 'g', 'CONFIG'));
  head.append(tag, h1, el('div', 'sub', 'CONFIG STUDIO'), el('div', 'rule'));
  app.append(head);

  const p1 = panel('01', 'PILIH CHARACTER', '<b>' + nameOf(data.characters, char).toUpperCase() + '</b>');
  const cg = el('div', 'chars');
  data.characters.forEach(c => {
    const b = el('button', 'char' + (c.id === char ? ' on' : ''));
    const art = el('div', 'art', c.name.charAt(0));
    b.append(art);
    if (c.image) {
      const img = document.createElement('img');
      img.src = c.image; img.alt = c.name;
      img.onerror = () => img.remove();
      b.append(img);
    }
    const cap = el('div', 'cap');
    cap.append(el('small', '', 'CHARACTER'), el('strong', '', c.name));
    b.append(el('div', 'shade'), cap, el('div', 'ok', 'TERPILIH'));
    b.onclick = () => { if (char !== c.id) { char = c.id; render(); } };
    cg.append(b);
  });
  p1.append(cg);
  app.append(p1);

  const p2 = panel('02', 'PILIH VERSI', '<b>' + nameOf(data.versions, version).toUpperCase() + '</b>');
  const seg = el('div', 'seg');
  data.versions.forEach(v => {
    const b = el('button', v.id === version ? 'on' : '', v.name);
    b.onclick = () => { if (version !== v.id) { version = v.id; render(); } };
    seg.append(b);
  });
  p2.append(seg);
  app.append(p2);

  const pk = picks();
  const picked = data.categories.filter(c => pk[c.id]);
  const p3 = panel('03', 'PREVIEW PILIHAN', '<b>' + picked.length + '</b> DIPILIH');
  const pv = el('div', 'preview');
  if (!picked.length) pv.append(el('div', 'empty', 'Pilih item untuk lihat preview di sini.'));
  picked.forEach(c => {
    const it = pk[c.id];
    const chip = el('div', 'chip');
    const tx = el('div');
    tx.append(el('em', '', c.name), el('span', 'nm', it.name));
    const x = el('button', '', '×');
    x.onclick = () => { delete picks()[c.id]; render(); };
    chip.append(thumbBox('cth', it), tx, x);
    pv.append(chip);
  });
  p3.append(pv);
  app.append(p3);

  const p4 = panel('04', 'PILIH ITEM', '<b>' + picked.length + '</b> / ' + data.categories.length + ' DIPILIH');
  const cats = el('div', 'cats');
  data.categories.forEach(c => {
    const b = el('button', 'cat' + (c.id === category ? ' on' : ''), c.name);
    if (pk[c.id]) b.append(el('span', 'dot', '✓'));
    b.onclick = () => { category = c.id; render(); };
    cats.append(b);
  });
  const grid = el('div', 'items');
  const list = data.items.filter(i => i.character === char && i.version === version && i.category === category);
  if (!list.length) grid.append(el('div', 'none', 'Belum ada item di kategori ini.'));
  list.forEach(it => {
    const on = pk[category] && pk[category].id === it.id;
    const b = el('button', 'item' + (on ? ' on' : ''));
    const t = el('div', 'tt', it.name);
    b.append(thumbBox('th', it), t, el('div', 'chk', '✓'));
    b.onclick = () => {
      const cur = picks();
      if (cur[category] && cur[category].id === it.id) delete cur[category];
      else cur[category] = it;
      render();
    };
    grid.append(b);
  });
  p4.append(cats, grid);
  app.append(p4);

  app.append(el('footer', '', 'VORTEX CONFIG STUDIO'));
  const nc = app.querySelector('.cats');
  if (nc) nc.scrollLeft = catScroll;
  first = false;
  updateBar();
}

function updateBar() {
  const n = data.categories.filter(c => picks()[c.id]).length;
  const btn = document.getElementById('dl');
  btn.disabled = n === 0;
  btn.textContent = n ? 'DOWNLOAD ZIP  •  ' + n + ' ITEM' : 'PILIH ITEM DULU';
}

async function download() {
  const pk = picks();
  const list = data.categories.map(c => pk[c.id]).filter(Boolean);
  if (!list.length) return;
  const btn = document.getElementById('dl');
  btn.disabled = true;
  const folder = 'VortexConfig-' + char + '-' + version;
  try {
    const zip = new JSZip();
    const root = zip.folder(folder);
    for (let i = 0; i < list.length; i++) {
      btn.textContent = 'MENGUNDUH ' + (i + 1) + '/' + list.length + '...';
      const r = await fetch(list[i].file);
      if (!r.ok) throw new Error(list[i].name + ' gagal diunduh (status ' + r.status + ')');
      const name = decodeURIComponent(list[i].file.split('/').pop());
      root.folder(list[i].category).file(name, await r.arrayBuffer());
    }
    btn.textContent = 'MEMBUAT ZIP...';
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = folder + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) {
    alert('Gagal: ' + e.message);
  } finally {
    updateBar();
  }
}

document.getElementById('dl').onclick = download;
init();
</script>
</body>
</html>
